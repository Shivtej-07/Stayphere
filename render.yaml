services:
  - type: web
    name: stayphere-backend
    env: node
    plan: free
    repo: https://github.com/Shivtej-07/Stayphere # Updated repo URL
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

  - type: static
    name: stayphere-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist 
    envVars:
      - key: VITE_API_BASE_URL
        sync: false 
